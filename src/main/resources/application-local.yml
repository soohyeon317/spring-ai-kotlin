spring:
  config:
    activate:
      on-profile: local
  ai:
    openai:
      api-key: ollama # Ollama는 키를 검사하지 않지만, OpenAI 클라이언트에 빈 값이 아닌 키가 필요합니다.
      chat:
        model: hf.co/unsloth/gemma-4-E4B-it-GGUF:Q4_K_M
        base-url: http://localhost:11434/v1
#        completions-path: /chat/completions
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always # always는 매 시작마다 DDL을 실행하므로 로컬/개발 환경에는 적합하지만, 운영(production) 환경에서는 보통 never로 두고 Flyway/Liquibase 등으로 스키마를 별도 관리하는 것이 일반적입니다.
            schema: classpath:schema/conversation-history-postgresql.sql # 테이블명을 conversation_history로 바꾼 커스텀 스키마 (Spring AI에는 table-name 프로퍼티가 없음)
            continue-on-error: false # 기본값 true는 스키마 SQL 에러를 무시하고 기동하므로, 에러 시 기동 실패하도록 설정
  datasource:
    url: jdbc:postgresql://localhost:5432/spring_ai_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 3000
      validation-timeout: 3000
      pool-name: HikariPool-SpringAiKotlin
      minimum-idle: 10
      maximum-pool-size: 50
      max-lifetime: 1800000
      idle-timeout: 1500000
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: true
