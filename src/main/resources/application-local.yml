spring:
  config:
    activate:
      on-profile: local
  ai:
    openai:
      api-key: ollama # Ollama는 키를 검사하지 않지만, OpenAI 클라이언트에 빈 값이 아닌 키가 필요합니다.
      chat:
        model: hf.co/unsloth/gemma-4-E4B-it-GGUF:Q4_K_M
        base-url: http://localhost:11434/v1
#        completions-path: /chat/completions
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always # always는 매 시작마다 DDL을 실행하므로 로컬/개발 환경에는 적합하지만, 운영(production) 환경에서는 보통 never로 두고 Flyway/Liquibase 등으로 스키마를 별도 관리하는 것이 일반적입니다.
#            table-name: spring_ai_chat_memory
  datasource:
    url: jdbc:postgresql://localhost:5432/spring_ai_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 3000
      validation-timeout: 3000
      pool-name: HikariPool-SpringAiKotlin
      minimum-idle: 10
      maximum-pool-size: 50
      max-lifetime: 1800000
      idle-timeout: 1500000
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: true
